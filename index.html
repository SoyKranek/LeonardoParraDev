<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Leonardo Parra — Desarrollador Full Stack Semi Senior (.NET, React, APIs REST, IA asistida con Cursor y Claude)."
    />
    <meta name="theme-color" content="#0b1220" id="meta-theme-color" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Leonardo Parra — Full Stack .NET · React · AWS" />
    <meta
      property="og:description"
      content="Desarrollador Full Stack con 3+ años en producción. ASP.NET Core, React, TypeScript y APIs REST."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Leonardo Parra — Full Stack .NET · React · AWS</title>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem('portfolio-theme');
          if (theme === 'light') {
            root.classList.add('light');
            root.dataset.theme = 'light';
            root.style.colorScheme = 'light';
            var meta = document.getElementById('meta-theme-color');
            if (meta) meta.setAttribute('content', '#f1f5f9');
          } else {
            root.classList.remove('light');
            root.dataset.theme = 'dark';
            root.style.colorScheme = 'dark';
          }
          var locale = localStorage.getItem('portfolio-locale');
          if (locale === 'en') root.lang = 'en';
          else if (locale === 'es') root.lang = 'es';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
